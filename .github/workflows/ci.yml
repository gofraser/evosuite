name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Check licence headers
        if: matrix.java == 17
        run: mvn -B -ntp license:check
      # verify, not test: some runtime tests need the packaged runtime jar.
      - name: Build and test
        run: mvn -B -ntp verify -Djava.awt.headless=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  java8-cli:
    name: Build on JDK 11 and run on JDK 8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            11
          cache: maven
      - name: Package the Java 8 CLI and runtime
        run: mvn -B -ntp -Pjava8-cli -Drevision=java8-SNAPSHOT -DskipTests clean package
      - name: Generate and replay a test with a functional mock on Java 8
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          engine="$PWD/master/target/evosuite-master-java8-SNAPSHOT.jar"
          runtime="$PWD/standalone_runtime/target/evosuite-standalone-runtime-java8-SNAPSHOT.jar"
          junit="$HOME/.m2/repository/junit/junit/4.13.2/junit-4.13.2.jar"
          hamcrest="$HOME/.m2/repository/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          cd "$(mktemp -d)"
          cat > Calculator.java <<'EOF'
          package probe;
          public class Calculator {
              public interface Provider { int read(); }
              public int score(Provider provider) { return provider.read() < 0 ? -1 : 1; }
          }
          EOF
          mkdir classes
          javac -d classes Calculator.java
          java -Djava.awt.headless=true -jar "$engine" -class probe.Calculator -projectCP classes \
            -criterion BRANCH -seed 17 -Dsearch_budget=10 -Dtest_format=JUNIT4 \
            -Dp_functional_mocking=1 -Dfunctional_mocking_percent=0
          grep -q 'org.evosuite.shaded.org.mockito.Mockito' evosuite-tests/probe/Calculator_ESTest.java
          test_cp="classes:$runtime:$junit:$hamcrest"
          javac -cp "$test_cp" -d classes evosuite-tests/probe/*.java
          java -Djava.awt.headless=true "-javaagent:$runtime" -cp "$test_cp" \
            org.junit.runner.JUnitCore probe.Calculator_ESTest

  newer-jdk-build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [26, 27]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build the full reactor
        run: mvn -B -ntp clean verify -DskipTests -Djava.awt.headless=true

  # The JDK 25 job checks the default runtime build. The full
  # suite is not run here; this checks that the build compiles and that the
  # runtime module works. Experimental, so it does not fail the workflow.
  jdk25:
    name: Runtime build and tests (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test the runtime
        run: mvn -B -ntp verify -pl runtime -am -Djava.awt.headless=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk25
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  eclipse-plugin:
    name: Eclipse plugin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The reactor needs JDK 17 and Tycho needs 21. Both are installed; the
      # last one listed (17) becomes JAVA_HOME, the other is JAVA_HOME_21_X64.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
          cache: maven
      - name: Build the engine jars the plugin bundles
        run: mvn -B -ntp -pl master,standalone_runtime -am package -DskipTests
      - name: Install xvfb and GTK for the UI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0
      - name: Build and test the plugin
        working-directory: plugins/eclipse
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          xvfb-run --auto-servernum ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-eclipse
          path: plugins/eclipse/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
