name: IntelliJ plugin
on:
  pull_request:
    paths: ['plugins/intellij/**', 'plugins/ide-core/**', 'pom.xml', 'master/**', 'client/**', 'runtime/**', 'standalone_runtime/**', '.github/workflows/intellij-plugin.yml']
  workflow_dispatch:
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build bundled engine and shared core
        run: mvn -B -pl master,standalone_runtime,plugins/ide-core -am package -DskipTests
      - name: Shared behavior tests
        run: mvn -B -f plugins/ide-core/pom.xml verify
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        working-directory: plugins/intellij
        run: ./gradlew test buildPlugin -Pevosuite.it.javaHome="$JAVA_HOME_17_X64"
      - name: Verify platform compatibility
        working-directory: plugins/intellij
        run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellij-plugin
          path: |
            plugins/intellij/build/distributions/*.zip
            plugins/intellij/build/reports/
            plugins/ide-core/target/surefire-reports/
