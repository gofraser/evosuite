version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
# plugins/eclipse is deliberately not listed: its versions come from the Tycho
# target platform and Eclipse p2 repositories, which Dependabot cannot resolve,
# and bumping them needs a manual compatibility check.
